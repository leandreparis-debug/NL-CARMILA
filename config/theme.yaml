# Thème de la newsletter : tout ce qui relève de la charte graphique est ici, et seulement ici.
#
# Valeurs tirées de la charte « Les fondamentaux de la marque Carmila » (avril 2023) :
# couleurs p. 11, typographies p. 13-15, logotype p. 8-10, formes et motif p. 21-22,
# header newsletter p. 26 (mode d'emploi : docs/theme.md). Après modification, ouvrez
# l'écran « Thème » de l'application : il vérifie le fichier et les contrastes.
#
# Règles : couleurs au format #RRGGBB ; polices système uniquement (pas de police en ligne :
# Gmail et l'impression doivent rendre la même chose sur tous les postes) ; chemins de
# fichiers relatifs au dossier du projet.

# Nom affiché dans le bandeau d'en-tête.
name: News Franchise

# Phrase sous le bandeau.
tagline: La newsletter mensuelle de Carmila Franchise

colors:
  # Rouge Carmila (couleur identitaire) : bandeau d'en-tête, filets, grands éléments.
  # Jamais pour du petit texte : blanc sur ce rouge = 3,8:1, réservé au grand texte.
  primary: "#EF4050"
  # Vert foncé (couleur secondaire de la charte) : titres, liens, chiffres de la Une.
  secondary: "#004D46"
  # Gris de la charte : texte courant.
  text: "#58595B"
  # Gris plus clair : sources, dates, légendes (reste lisible sur blanc et sur crème).
  muted: "#6D6E71"
  # Fond : reste blanc (impression et e-mail).
  background: "#FFFFFF"
  # Crème (couleur secondaire de la charte) : encadrés (Une, sommaire, rencontres…).
  surface: "#FFF1E2"
  # Séparateurs fins.
  border: "#EADBC8"
  # Badge « Opportunité emplacements » : fond jaune identitaire, texte vert foncé.
  opportunity: "#FFCC32"
  opportunity_text: "#004D46"

# Couleur d'accent de chaque rubrique (formes, numéros, filets), dans la palette Carmila.
# Le numéro est écrit en blanc ou en vert foncé, selon ce qui contraste le mieux.
section_colors:
  une: "#FFCC32"
  rubrique_1: "#EF4050"
  rubrique_2: "#60C3AD"
  rubrique_3: "#FEC46F"
  rubrique_4: "#004D46"
  rubrique_5: "#5192BB"
  rubrique_6: "#EF4050"

fonts:
  # Charte : Josefin Sans, et Century Gothic comme police système de substitution (p. 15).
  # Pas de police en ligne : Century Gothic (installée avec Office), puis équivalents.
  body: "'Century Gothic', 'URW Gothic', 'Avant Garde', 'Trebuchet MS', Arial, sans-serif"
  headings: "'Century Gothic', 'URW Gothic', 'Avant Garde', 'Trebuchet MS', Arial, sans-serif"
  # Charte : Oswald (condensée) pour les encadrés et les chiffres (p. 14). Équivalent
  # système : Bahnschrift Condensed (Windows 10 et 11), puis Arial Narrow.
  labels: "'Bahnschrift Condensed', Bahnschrift, 'Arial Narrow', 'Nimbus Sans Narrow', sans-serif"

# Logotype Carmila (PNG ou JPEG, relatif au dossier du projet), extrait de la charte.
# Version couleurs pour fond blanc (pied de page, « logo en bas centré » p. 27) …
logo: config/assets/logo-carmila.png
# … et version en réserve blanche, uniquement sur une couleur de la palette (bandeau rouge).
logo_reverse: config/assets/logo-carmila-blanc.png
# Texte alternatif des logos (lu à la place de l'image si elle ne s'affiche pas).
logo_alt: Carmila

# Texte du pied de page.
footer_text: "Newsletter interne Carmila Franchise — diffusion réservée aux équipes Carmila."

# Titres des rubriques, modifiables.
section_titles:
  une: "À la une ce mois-ci"
  rubrique_1: "Marché de la franchise"
  rubrique_2: "Nos enseignes"
  rubrique_3: "Ouvertures du mois"
  rubrique_4: "Enseignes rencontrées"
  rubrique_5: "Franchisés identifiés"
  rubrique_6: "Plans de développement"
