{# Enseignes rencontrées (rubrique 4) : cartes compactes sur deux colonnes. #}
<ul class="nl-meetings">
  {% for item in section.items %}
    <li class="nl-meeting">
      <strong>{{ item.brand }}</strong>
      {% if item.date_label %}<span class="nl-date">{{ item.date_label }}</span>{% endif %}
      {% if item.comment %}<span class="nl-comment">{{ item.comment }}</span>{% endif %}
    </li>
  {% endfor %}
</ul>
