# Référentiel des enseignes suivies par Carmila Franchise.
#
# Chargé et synchronisé en base à chaque démarrage de l'application :
# - une enseigne ajoutée ici est créée ;
# - le secteur et les alias sont mis à jour ;
# - une enseigne retirée n'est jamais effacée : elle n'est simplement plus suivie.
#
# Champs : name (obligatoire, unique), sector (texte), aliases (autres écritures du nom,
# utilisées plus tard pour repérer l'enseigne dans les articles). Un nom ou un alias ne
# peut désigner qu'une seule enseigne (la casse, les accents et le type d'apostrophe ne
# comptent pas pour cette vérification).
#
# SECTEURS À VÉRIFIER par l'utilisateur, en particulier « Mira Mira » (à compléter).

