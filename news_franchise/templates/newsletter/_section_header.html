{# En-tête de rubrique : numéro sur deux chiffres dans une arche de la couleur d'accent,
   titre (config/theme.yaml) et filet court, comme les titres de la charte. #}
<header class="nl-section-head">
  <span class="nl-section-number">{{ section.number_label }}</span>
  <div>
    <h2 class="nl-section-title">{{ section.title }}</h2>
    <span class="nl-rule"></span>
  </div>
</header>
